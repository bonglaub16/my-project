<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Display</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="viewer-shell">
    <section class="card viewer-card">
      <div class="brand-row">
        <div class="brand-mark">QR</div>
        <div>
          <p class="eyebrow">TRUY CẬP NHANH</p>
          <h1 id="displayTitle">Quét mã QR để truy cập</h1>
        </div>
      </div>

      <div id="statusBadge" class="status-badge">Đang kết nối...</div>

      <div class="qr-wrap">
        <div id="qrContainer" class="qr-container" aria-label="Mã QR"></div>
      </div>

      <p id="helperText" class="helper-text">Mở Camera hoặc Zalo và hướng vào mã QR</p>
      <a id="currentLink" class="current-link" href="#" target="_blank" rel="noopener noreferrer">Đang tải đường dẫn...</a>

      <div class="viewer-actions">
        <button id="fullscreenBtn" class="btn btn-secondary">⛶ Toàn màn hình</button>
      </div>
    </section>
  </main>

  <script src="js/qrcode.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
