<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Admin</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <main class="admin-shell">
    <section class="card admin-card">
      <div class="admin-header">
        <div>
          <p class="eyebrow">QUẢN TRỊ</p>
          <h1>Quản lý mã QR</h1>
        </div>
        <button id="logoutBtn" class="btn btn-ghost hidden">Đăng xuất</button>
      </div>

      <div id="message" class="message hidden"></div>

      <form id="loginForm" class="stack">
        <label>Email
          <input id="email" type="email" autocomplete="email" required placeholder="admin@example.com" />
        </label>
        <label>Mật khẩu
          <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
        </label>
        <button class="btn btn-primary" type="submit">Đăng nhập</button>
      </form>

      <div id="adminPanel" class="hidden">
        <div class="current-box">
          <span>Link hiện tại</span>
          <a id="adminCurrentLink" href="#" target="_blank" rel="noopener noreferrer">—</a>
          <small id="updatedAt">Chưa có dữ liệu</small>
        </div>

        <form id="updateForm" class="stack section-gap">
          <label>Tiêu đề hiển thị
            <input id="titleInput" type="text" maxlength="80" placeholder="Quét mã QR để truy cập" />
          </label>
          <label>Nhập link mới
            <input id="urlInput" type="url" required placeholder="https://..." />
          </label>
          <div class="preview-box">
            <canvas id="previewCanvas" width="240" height="240"></canvas>
          </div>
          <button class="btn btn-primary" type="submit">Lưu và cập nhật mã QR</button>
        </form>

        <section class="section-gap">
          <div class="section-title-row">
            <div>
              <p class="eyebrow">LỊCH SỬ</p>
              <h2>Các đường dẫn gần đây</h2>
            </div>
            <button id="refreshHistoryBtn" class="btn btn-secondary" type="button">Làm mới</button>
          </div>
          <div id="historyList" class="history-list"></div>
        </section>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
